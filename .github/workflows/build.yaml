name: Update profile card

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # "Run workflow" button
  push:
    branches: [main]
    paths:
      - "today.py"
      - "ascii.txt"
      - ".github/workflows/build.yaml"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build SVGs
        env:
          # Personal token (repo + read:user) gives full stats; falls back to the built-in token
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python today.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/ || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update profile card"
            git push
          fi
